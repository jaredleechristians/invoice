services:
  api:
    build: ./backend
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      GOTENBERG_HOSTNAME: ${GOTENBERG_HOSTNAME}
      OPENAI_API_HOSTNAME: ${OPENAI_API_HOSTNAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-openrouter/free}
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NUXT_API_PROXY: http://api:8787
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NUXT_API_PROXY: http://api:8787
    depends_on:
      - api
    restart: unless-stopped
