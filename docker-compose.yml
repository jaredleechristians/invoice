# Development (default): live reload — API --watch + Nuxt HMR.
# Production local build: docker compose -f docker-compose.prod.yml up --build
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "8787"
      GOTENBERG_HOSTNAME: ${GOTENBERG_HOSTNAME}
      OPENAI_API_HOSTNAME: ${OPENAI_API_HOSTNAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-openrouter/free}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      PORT: "3000"
      NUXT_API_PROXY: http://api:8787
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NUXT_PUBLIC_FIREBASE_API_KEY: ${NUXT_PUBLIC_FIREBASE_API_KEY:-}
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${NUXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NUXT_PUBLIC_FIREBASE_APP_ID: ${NUXT_PUBLIC_FIREBASE_APP_ID:-}
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm ci --legacy-peer-deps 2>/dev/null || npm install --legacy-peer-deps; npm run dev"
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
