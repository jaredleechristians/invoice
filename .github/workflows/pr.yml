name: PR to main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version-bump:
    name: Version bump
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.final.outputs.version }}
      bumped: ${{ steps.final.outputs.bumped }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to bump
        id: should_bump
        run: |
          msg=$(git log -1 --pretty=%B)
          if echo "$msg" | grep -qiE '^chore: bump version|^chore\(release\):'; then
            echo "do_bump=false" >> "$GITHUB_OUTPUT"
            echo "Latest commit is already a version bump — skipping"
          else
            echo "do_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.should_bump.outputs.do_bump == 'true'
        run: node scripts/bump-version.js patch

      - name: Commit and push version bump
        if: steps.should_bump.outputs.do_bump == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json frontend/package.json backend/package.json
          git commit -m "chore: bump version to ${VERSION}"
          git push origin HEAD:${{ github.head_ref }}

      - name: Export version
        id: final
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.should_bump.outputs.do_bump }}" = "true" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build packages
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NUXT_API_PROXY: http://127.0.0.1:8787

      - name: Verify frontend build output
        run: |
          test -d frontend/.output
          ls -la frontend/.output
          du -sh frontend/.output

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            invoice-api:${{ needs.version-bump.outputs.version }}
            invoice-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          build-args: |
            NUXT_API_PROXY=http://api:8787
          tags: |
            invoice-web:${{ needs.version-bump.outputs.version }}
            invoice-web:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v5
        with:
          name: invoice-web-${{ needs.version-bump.outputs.version }}
          path: frontend/.output
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload backend package artifact
        uses: actions/upload-artifact@v5
        with:
          name: invoice-api-${{ needs.version-bump.outputs.version }}
          path: |
            backend/server.js
            backend/package.json
          if-no-files-found: error

      - name: Comment build summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.version-bump.outputs.version }}';
            const bumped = '${{ needs.version-bump.outputs.bumped }}';
            const marker = '<!-- invoice-build-summary -->';
            const body = [
              marker,
              `### Build ready`,
              ``,
              `- Version: \`v${version}\`${bumped === 'true' ? ' (bumped on this PR)' : ''}`,
              `- Artifacts: \`invoice-web-${version}\`, \`invoice-api-${version}\``,
              `- Docker images built: \`invoice-web:${version}\`, \`invoice-api:${version}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
